<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Balthazar&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <header> 
        <h1>Magic the Gathering Cards</h1>
    </header>

    <button class="accordion"> Filters</button>

    <div id="widgets">

        <div id="search-bar">
            <p>Search Bar <br>(text on the cards)</p>
            <input id="term" type="text" size="20" maxlength="20" />
        </div>

        <div class="search-limit">
            <p> Number of Cards</p>
            <select id="limit">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <div class="sort-types">
            <p>Sort Type</p>
            <select id="sorts">
                <option value="name">Name</option>
                <option value="set">Set</option>
                <option value="rarity">Rarity</option>
                <option value="cmc">Mana Value</option>
                <option value="power">Power</option>
                <option value="toughness">Toughness</option>
                <option value="artist">Artist Name</option>
            </select>
        </div>

        <div class="card-color">
            <p>Card Colors</p>
            <select id="colors">
                <option value="none">None</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="black">Black</option>
                <option value="white">White</option>
                <option value="colorless">Colorless</option>
            </select>
        </div>

        <div class="card-type">
            <p>Card Types</p>
            <select id="types">
                <option value="none">None</option>
                <option value="artifact">Artifact</option>
                <option value="battle">Battle</option>
                <option value="creature">Creature</option>
                <option value="enchantment">Enchantment</option>
                <option value="instant">Instant</option>
                <option value="kindred">Kindred</option>
                <option value="land">Land</option>
                <option value="planeswalker">Planeswalker</option>
                <option value="sorcery">Sorcery</option>
            </select>
        </div>

        <div class="card-rarity">
            <p>Card Rarities</p>
            <select id="rarities">
                <option value="none">None</option>
                <option value="common">Common</option>
                <option value="uncommon">Uncommon</option>
                <option value="rare">Rare</option>
                <option value="special">Special</option>
                <option value="mythic">Mythic</option>
                <option value="bonus">Bonus</option>
            </select>
        </div>

        <div class="card-language">
            <p>Card Language</p>
            <select id="langs">
                <option value="none">None</option>
                <option value="en">English</option>
                <option value="ja">Japanese</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="it">Italian</option>
                <option value="zhs">Simple Chinese</option>
                <option value="pt">Portuguesus</option>
                <option value="zht">Chinese</option>
                <option value="ru">Russian</option>
                <option value="hr">Korean</option>
                <option value="ph">Phyrexian</option>
                <option value="qya">Quenya</option>
                <option value="grc">Ancient Greek</option>
                <option value="he">Hebrew</option>
                <option value="la">Latin</option>
                <option value="ar">Arabic</option>
                <option value="sa">Sanskrit</option>

            </select>
        </div>

        <div id="search-button">
            <button>Search</button>
        </div>
    </div>


    <h2 id="results">Results</h2>

    <div id="status">
        <h3>Ready to Search!</h3></div>

    <div id="content">
    </div>

    <footer>
        <p>&copy Tanvee Padhi 2026</p>
    </footer>

    <script src="js/main.js"></script> 
    
</body>
</html>
