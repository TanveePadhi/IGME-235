    <header> 
        <h1>Magic the Gathering Cards</h1>

    <div id="widgets">
        search bar plus filters to be implemented

        <div id="search-bar">
            <input id="term" type="text" size="20" maxlength="20" autofocus value="flying"/>
        </div>

        <div class="search-limit">
            <select id="limit">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <div class="sort-types">
            sort types for card
            <select id="sorts">
                <option value="name">Name</option>
                <option value="set">Set</option>
                <option value="rarity">Rarity</option>
                <option value="cmc">Mana Value</option>
                <option value="power">Power</option>
                <option value="toughness">Toughness</option>
                <option value="artist">Artist Name</option>
            </select>
        </div>

          <div class="card-color">
            card colors
            <select id="colors">
                <option value="none">None</option>
                <option value="red">Red</option>
                <option value="green">Green</option>
                <option value="blue">Blue</option>
                <option value="black">Black Value</option>
                <option value="white">White</option>
                <option value="colorless">Colorless</option>
            </select>
        </div>

          <div class="card-type">
            card types
            <select id="types">
                <option value="none">None</option>
                <option value="artifact">Artifact</option>
                <option value="battle">Battle</option>
                <option value="creature">Creature</option>
                <option value="enchantment">Enchantment</option>
                <option value="instant">Instant</option>
                <option value="kindred">Kindred</option>
                <option value="land">Land</option>
                <option value="planeswalker">Planeswalker</option>
                <option value="sorcery">Sorcery</option>
            </select>
        </div>
    </div>

    <div id="search-button">
        <button>Search</button>
    </div>

    <h2>Results</h2>

    <div id="status">Ready to Search!</div>

    <div id="content">
        No Cards Yet
    </div>

         window.onload = (e) => {document.querySelector("#search-button").onclick = searchButtonClicked};

         let searchTerm = "";
         let sortType = "";
         let cardColor = "";
         let cardType = "";

         function searchButtonClicked(){
            //console.log("searchButtonClicked() called");

            const SCRYFALL_URL = "https://api.scryfall.com/cards/search?order=";

            let url = SCRYFALL_URL;

            //adding a sort type
            let sort = document.querySelector("#sorts").value;
            sortType = sort;

            url += sortType;

            //retrieving search term from search bar
            let term = document.querySelector("#term").value
            searchTerm = term;

            term.trim();

            //handleing empty search bar
            if(!term) {
                url += "&q=";
            }
            else{
                url += "&q=fo:" + term;
            }

            //adding a limtit check with proffessor since it seems the scryfall api doesnt have a limit

            //adding a color
            let color = document.querySelector("#colors").value;
            cardColor = color;

            if(cardColor != 'none'){
                url += "+c:" + cardColor;
            }

            //adding a card type
            let type = document.querySelector("#types").value;
            cardType = type;

            if(cardType != 'none'){
                url += "+t:" + cardType;
            }
            console.log(url);

            //updating status
            document.querySelector("#status").innerHTML = `
            Searching in order of ${sortType.toUpperCase()}. 
            ${cardColor.toUpperCase()} colored cards of ${cardType.toUpperCase()} type`;

            //calling getData method 
            getData(url);

         }
        //getting data from api
        function getData(url){
            let xhr = new XMLHttpRequest();

            xhr.onload = dataLoaded;
            xhr.onerror = (e) => {
                console.log("an error has happened");
            }

            xhr.open("GET", url);
            xhr.send();           

            }

        function dataLoaded(e){
            let xhr = e.target;
            console.log(xhr.responseText);

            let data = JSON.parse(xhr.responseText);
